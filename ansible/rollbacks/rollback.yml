---
# Emergency Rollback to Clean Baseline
- name: Wipe Switch Configuration to Baseline
  hosts: switches
  gather_facts: false

  tasks:
    - name: Default all interface configurations
      cisco.ios.ios_config:
        lines:
          - default interface range GigabitEthernet0/0-3
          - default interface range GigabitEthernet1/0-3
          - default interface range GigabitEthernet2/0-3
          - default interface range GigabitEthernet3/0-3

    - name: Delete project VLANs
      cisco.ios.ios_vlans:
        config:
          - vlan_id: 10
          - vlan_id: 99
          - vlan_id: 100
        state: deleted
